<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <title>Facturas - Corralón</title>
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <div>
        <h1 class="mb-0">Facturas</h1>
        <p class="text-secondary mb-0">Al emitir una factura se descuenta el stock; al anularla se devuelve.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-nueva">Nueva factura</button>
    </div>

    <form id="form-filtros" class="panel panel-cuerpo mb-3">
      <div class="row g-3 align-items-end">
        <div class="col-6 col-md-3"><label class="form-label" for="f-desde">Desde</label>
          <input type="date" class="form-control" id="f-desde"></div>
        <div class="col-6 col-md-3"><label class="form-label" for="f-hasta">Hasta</label>
          <input type="date" class="form-control" id="f-hasta"></div>
        <div class="col-6 col-md-3"><label class="form-label" for="f-estado">Estado</label>
          <select class="form-select" id="f-estado">
            <option value="">Todos</option><option value="Emitida">Emitidas</option><option value="Anulada">Anuladas</option>
          </select></div>
        <div class="col-6 col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-grow-1">Filtrar</button>
          <button type="button" class="btn btn-outline-secondary" id="btn-limpiar">Limpiar</button>
        </div>
      </div>
    </form>

    <div class="panel">
      <div class="tabla-wrap"><table class="table table-hover">
        <thead><tr>
          <th>N°</th><th>Fecha</th><th>Cliente</th><th>Forma de pago</th><th>Vendedor</th>
          <th class="num">Total</th><th>Estado</th><th><span class="visually-hidden">Acciones</span></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
      <div class="px-3 py-2 border-top d-flex justify-content-between flex-wrap gap-2">
        <span id="resumen" class="text-secondary"></span>
        <span>Total de las facturas emitidas: <strong id="suma-total">$ 0,00</strong></span>
      </div>
    </div>
  </main>

  <!-- Alta / modificación / detalle -->
  <div class="modal fade" id="modal-factura" tabindex="-1" aria-labelledby="modal-factura-titulo" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
      <form id="form-factura" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-factura-titulo">Factura</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="datos-anulacion" class="alert alert-secondary d-none"></div>

          <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label" for="m-cliente">Cliente *</label>
              <select class="form-select" id="m-cliente" required></select></div>
            <div class="col-md-4"><label class="form-label" for="m-forma">Forma de pago *</label>
              <select class="form-select" id="m-forma" required></select></div>
            <div class="col-md-4"><label class="form-label" for="m-obs">Observaciones</label>
              <input type="text" class="form-control" id="m-obs" maxlength="300"></div>
          </div>

          <h3 class="mb-2">Detalle</h3>
          <div class="row g-2 align-items-end mb-3" id="agregar-linea">
            <div class="col-md-7"><label class="form-label" for="m-articulo">Artículo</label>
              <select class="form-select" id="m-articulo" form="sin-form"></select></div>
            <div class="col-6 col-md-3"><label class="form-label" for="m-cantidad">Cantidad</label>
              <input type="number" class="form-control" id="m-cantidad" min="1" step="1" form="sin-form"></div>
            <div class="col-6 col-md-2 d-grid"><button type="button" class="btn btn-outline-primary" id="btn-agregar">Agregar</button></div>
          </div>

          <div class="panel"><div class="tabla-wrap"><table class="table">
            <thead><tr><th>Código</th><th>Artículo</th><th class="num">Precio</th><th class="num">Cantidad</th>
              <th class="num">Subtotal</th><th><span class="visually-hidden">Quitar</span></th></tr></thead>
            <tbody id="tb-lineas"></tbody>
          </table></div></div>
          <p class="text-end mt-3 mb-0">Total: <span class="linea-total" id="m-total">$ 0,00</span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar factura</button>
        </div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/facturas.js"></script>
</body>
</html>
