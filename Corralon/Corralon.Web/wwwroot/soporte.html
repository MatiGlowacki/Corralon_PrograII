<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <title>Soporte - Corralón</title>
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <div>
        <h1 id="titulo" class="mb-0">Soporte</h1>
        <p id="nota-permisos" class="text-secondary mb-0"></p>
      </div>
      <button type="button" class="btn btn-primary d-none" id="btn-nuevo">Nuevo registro</button>
    </div>

    <div class="panel panel-cuerpo mb-3">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <label for="buscar" class="visually-hidden">Buscar</label>
          <input type="search" id="buscar" class="form-control" placeholder="Buscar en la lista">
        </div>
        <div class="col-md-6">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="ver-inactivos">
            <label class="form-check-label" for="ver-inactivos">Mostrar también los dados de baja</label>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="tabla-wrap tabla-scroll"><table class="table table-hover">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </main>

  <!-- Alta / modificación -->
  <div class="modal fade" id="modal-form" tabindex="-1" aria-labelledby="modal-form-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <form id="form-crud" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-form-titulo">Registro</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="form-campos"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar</button>
        </div>
      </form>
    </div></div>
  </div>

  <!-- Ajuste de stock (solo artículos) -->
  <div class="modal fade" id="modal-stock" tabindex="-1" aria-labelledby="modal-stock-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
      <form id="form-stock" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-stock-titulo">Ajustar stock</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="stock-articulo" class="fw-semibold"></p>
          <div class="row g-3">
            <div class="col-6"><label class="form-label" for="st-tipo">Tipo</label>
              <select class="form-select" id="st-tipo" required><option>Entrada</option><option>Salida</option></select></div>
            <div class="col-6"><label class="form-label" for="st-motivo">Motivo</label>
              <select class="form-select" id="st-motivo" required><option value="Compra">Compra</option><option value="Ajuste">Ajuste</option><option value="Devolucion">Devolución</option></select></div>
            <div class="col-12"><label class="form-label" for="st-cantidad">Cantidad</label>
              <input type="number" class="form-control" id="st-cantidad" min="0.001" step="any" required>
              <div class="invalid-feedback">Ingresá una cantidad mayor a cero.</div></div>
            <div class="col-12"><label class="form-label" for="st-obs">Observaciones</label>
              <input type="text" class="form-control" id="st-obs" maxlength="200"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Registrar ajuste</button>
        </div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/soporte.js"></script>
</body>
</html>
